name: oracle-sampling

# HIP-3 全生态喂价连续采样：每 30 分钟一次，快照 + 喂价健康度状态页
# 一起落到 data 分支；GitHub Pages 以 data 分支为源自动构建
# （legacy branch 模式，不依赖 Actions artifact，绕开其间歇性元数据故障）。
# 注意：GitHub 会在仓库 60 天无活动后停用 scheduled workflow，期间需保持提交活跃。
# schedule 是有意保留的兜底：主触发是外部 cron（hip3-cf-scheduler Worker →
# workflow_dispatch，不受 GH 调度器静默跳过影响）；Worker 死掉时本 schedule
# 提供降级采样。双触发由下方 concurrency 锁串行化，代价仅为偶发一次重复运行。

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# 与 data-cleanup 共用一把锁：两者都写 data 分支，禁止并发（排队执行）
concurrency:
  group: data-branch

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run sampler
        run: node scripts/sample-oracles.mjs --save .data-run

      - name: Commit snapshot + status page to data branch
        run: |
          git config user.name "imokokok"
          git config user.email "145034722+imokokok@users.noreply.github.com"
          FILE=$(ls .data-run/snapshot-*.json | head -1)
          git fetch origin data || true
          mkdir -p .data-branch
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git worktree add -B data .data-branch origin/data
          else
            git worktree add --orphan -b data .data-branch
          fi
          mkdir -p .data-branch/snapshots
          cp "$FILE" .data-branch/snapshots/
          # 雷达 v2：墓志铭判定需要历史窗口，把新快照并入 data 工作树后再生成。
          # 生成失败不阻断快照落盘——丢一个采样点的代价高于页面短暂陈旧。
          if node scripts/status-page.mjs "$FILE" .status \
              --history .data-branch/snapshots \
              --alarms .status/alarms.jsonl \
              --rss .status/feed.xml; then
            cp .status/index.html .data-branch/index.html
            cp .status/alarms.jsonl .data-branch/alarms.jsonl
            cp .status/feed.xml .data-branch/feed.xml
          else
            echo "::warning::radar page generation failed; data branch keeps previous page"
          fi
          cd .data-branch
          git add snapshots index.html alarms.jsonl feed.xml
          git commit -m "snapshot $(date -u +%FT%TZ) [skip ci]" || echo "nothing to commit"
          git push origin HEAD:data
